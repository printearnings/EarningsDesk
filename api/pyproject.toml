[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earningsdesk-api"
version = "0.1.0"
description = "HTTP API for the EarningsDesk retail dashboard"
requires-python = ">=3.11"

# NOTE: the `earnings` package is deliberately NOT listed here. It's a local
# sibling repo, not a PyPI distribution, and declaring a bare `earnings`
# dependency would let pip resolve some unrelated package off PyPI. Install it
# explicitly instead:
#
#     pip install -e ../../Earnings/Earnings
#
# app/main.py checks for it at startup and fails with that instruction.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",  # fastapi TestClient
]

[tool.setuptools.packages.find]
include = ["app*"]

# Mirrors the engine repo's config so the two codebases lint identically.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. `Depends(...)` in a signature
# default is FastAPI's dependency-injection syntax, not the mutable-default bug
# the rule is aimed at — there is no other way to declare a dependency.
"app/routers.py" = ["B008"]
# I001/E402: bootstrap must be imported before anything from `earnings`, since
# it populates os.environ that earnings.config reads at import time. An import
# sorter would reorder it and silently unload the .env.
"app/main.py" = ["I001", "E402"]
"app/dump_json.py" = ["I001", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
