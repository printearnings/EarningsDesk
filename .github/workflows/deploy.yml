name: Deploy

# Builds the static site from the latest dashboard_snapshots and pushes it to
# the Cloudflare Worker. Two triggers:
#   - push to main: ship code changes (frontend, Worker, API schema) right away.
#   - twice-daily schedule: pick up the fresh data from the Earnings repo's
#     build_dashboard cron, which now runs twice a trading day (~50 minutes
#     before each of these) — see
#     patkhai/Earnings/.github/workflows/build_dashboard.yml:
#       ~8:10am ET (12:10 UTC, Mon-Fri) — BMO earnings settled before the open.
#       ~9:10pm ET (01:10 UTC, Tue-Sat) — AMC earnings settled after the close.
#     A push-triggered deploy would otherwise serve stale numbers until the
#     next code change happened to land.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL             — Neon Postgres, read-only is enough for dump_json.
#   CLOUDFLARE_API_TOKEN      — Workers Scripts:Edit permission.
#   CLOUDFLARE_ACCOUNT_ID     — wrangler.jsonc has no account_id, so this env
#                               var is how `wrangler deploy` knows which account.
#   GH_PAT_TOKEN              — patkhai/Earnings is private, so the default
#                               GITHUB_TOKEN (scoped to this repo only) can't
#                               check it out. Needs `repo` read access to
#                               patkhai/Earnings. Same secret name the Earnings
#                               repo itself already uses for cross-repo access.
#   SUPPORT_DESTINATION_EMAIL — real inbox the support form delivers to. Kept
#                               as a secret rather than in wrangler.jsonc; see
#                               scripts/gen-wrangler-config.mjs.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1-5" # ~50 min after the morning build_dashboard run.
    - cron: "0 2 * * 2-6" # ~50 min after the evening build_dashboard run.
  workflow_dispatch:

# A push landing mid-nightly-run would deploy a half-generated site; the
# reverse (nightly landing mid-push-deploy) would do the same. Queue rather
# than run concurrently, and don't cancel a deploy that's already shipping.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/day-gate.yml

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout EarningsDesk
        uses: actions/checkout@v4
        with:
          path: EarningsDesk

      # api/pyproject.toml deliberately doesn't declare `earnings` as a PyPI
      # dependency (it isn't one) — installed explicitly from its own repo,
      # same as the `pip install -e ../../Earnings/Earnings` a local checkout
      # uses, just via an absolute path since the two repos aren't siblings
      # in the runner's workspace the way they are on a local machine.
      # Self-referencing so each mirror pulls its OWN engine copy:
      # patkhai/EarningsDesk -> patkhai/Earnings, printearnings/EarningsDesk ->
      # printearnings/Earnings. GH_PAT_TOKEN on each account needs read access
      # to that account's private Earnings repo.
      - name: Checkout Earnings engine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Earnings
          path: Earnings
          token: ${{ secrets.GH_PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            EarningsDesk/package-lock.json
            EarningsDesk/web/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -e Earnings
          pip install -e EarningsDesk/api

      - name: Install Worker dependencies
        working-directory: EarningsDesk
        run: npm ci

      - name: Install frontend dependencies
        working-directory: EarningsDesk/web
        run: npm ci

      # Read-only against Postgres — no Massive/RapidAPI/LLM calls, so this
      # step needs only DATABASE_URL, not the full metered-API secret set
      # build_dashboard.yml uses.
      - name: Generate static data from the latest snapshots
        working-directory: EarningsDesk/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.dump_json --out ../web/public/data

      # `npm run test` includes strategy.conformance.test.ts, which asserts the
      # TS strategy logic against the shared fixture in the Earnings repo
      # (checked out above as a sibling). That guard only bites if it actually
      # runs, so the frontend tests belong in the deploy path — a drifted
      # strategy matrix would otherwise ship silently and make the track
      # record describe a structure the site never showed.
      - name: Typecheck, test, and build the frontend
        working-directory: EarningsDesk/web
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Generate wrangler config
        working-directory: EarningsDesk
        env:
          SUPPORT_DESTINATION_EMAIL: ${{ secrets.SUPPORT_DESTINATION_EMAIL }}
        run: node scripts/gen-wrangler-config.mjs

      - name: Deploy the Worker
        working-directory: EarningsDesk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.generated.jsonc
