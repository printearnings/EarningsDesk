<!doctype html>
<!-- Source for public/og.png (the 1200x630 link-preview image, see src/lib/seo.ts).
     Regenerate with headless Chrome from web/:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png og/og.html -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #080b11; color: #f8fafc; font-family: "Geist", sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 64px 76px; box-sizing: border-box; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(900px 420px at 85% 0%, rgba(0, 242, 254, 0.10), transparent 60%); }
  .brand, .main, .foot { position: relative; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .brand .muted { color: #94a3b8; }
  .eyebrow { font-family: "Geist Mono", monospace; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #00f2fe; margin-bottom: 18px; }
  h1 { font-size: 68px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; margin: 0; max-width: 1000px; }
  p { font-size: 27px; color: #94a3b8; margin: 22px 0 0; max-width: 960px; line-height: 1.4; }
  .foot { display: flex; gap: 14px; font-family: "Geist Mono", monospace; font-size: 20px; }
  .pill { border: 1px solid #1f293d; background: #111827; padding: 10px 18px; border-radius: 8px; color: #f8fafc; }
  .rich { color: #fb7185; } .cheap { color: #34d399; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="54" height="54" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="#00f2fe"/><path d="M8.5 18.5V14.5M14 18.5V9.5M19.5 18.5V12" stroke="#080b11" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>Print<span class="muted">Earnings</span></span>
  </div>
  <div class="main">
    <div class="eyebrow">Earnings options data</div>
    <h1>Know what's priced in before the print.</h1>
    <p>The move options are pricing into an earnings report, next to how far the stock actually moved its last eight quarters.</p>
  </div>
  <div class="foot">
    <span class="pill">Implied vs. past moves</span>
    <span class="pill"><span class="rich">RICH</span> / <span class="cheap">CHEAP</span> verdicts</span>
    <span class="pill">Data and analysis, not advice</span>
  </div>
</body>
</html>
